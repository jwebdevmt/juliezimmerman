<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | {{ site_title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="stylesheet" href="{{ asset_prefix }}assets/style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ asset_prefix }}assets/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ asset_prefix }}assets/favicon.png">
  <link rel="apple-touch-icon" href="{{ asset_prefix }}assets/favicon.png">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KE14CPL09E"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KE14CPL09E');
  </script>

  <script>
  window.jzTrackEvent = function(eventName, params) {
    if (typeof gtag === 'function') {
      gtag('event', eventName, params || {});
    }
  };

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('a[data-track]').forEach(function (link) {
      link.addEventListener('click', function () {
        window.jzTrackEvent(link.getAttribute('data-track'), {
          link_url: link.href,
          link_text: (link.textContent || '').trim(),
          page_path: window.location.pathname
        });
      });
    });
  });
  </script>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.nav-group-toggle').forEach(function (toggle) {
      toggle.addEventListener('click', function () {
        const group = toggle.closest('.nav-group');
        const opening = !group.classList.contains('open');
        document.querySelectorAll('.nav-group.open').forEach(function (other) {
          other.classList.remove('open');
          other.querySelector('.nav-group-toggle').setAttribute('aria-expanded', 'false');
        });
        group.classList.toggle('open', opening);
        toggle.setAttribute('aria-expanded', String(opening));
      });
    });
    document.addEventListener('click', function (event) {
      if (!event.target.closest('.nav-group')) {
        document.querySelectorAll('.nav-group.open').forEach(function (group) {
          group.classList.remove('open');
          group.querySelector('.nav-group-toggle').setAttribute('aria-expanded', 'false');
        });
      }
    });
  });
  </script>
</head>
<body>
  <header class="site-header">
    <div class="site-shell navbar">
      <a class="brand-mini" href="{{ asset_prefix }}index.html">
        <img class="brand-mark" src="{{ asset_prefix }}assets/brand-mark.svg" alt="">
        <span>{{ owner_name }}</span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        {{ nav_links }}
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="site-shell footer-grid">
      <div>
        <img class="footer-logo" src="{{ asset_prefix }}assets/jz-wordmark.svg" alt="{{ owner_name }}">
        <p class="footer-role">{{ owner_role }} <span aria-hidden="true">•</span> {{ owner_location }}</p>
        <p class="footer-note">{{ employment_note }}</p>
        <p class="footer-copyright">© {{ year }} {{ owner_name }}</p>
      </div>
      <nav class="footer-links" aria-label="Professional links">
        <a href="{{ github_url }}" target="_blank" rel="noopener" data-track="footer_github">GitHub</a>
        <a href="{{ linkedin_url }}" target="_blank" rel="noopener" data-track="footer_linkedin">LinkedIn</a>
        <a href="{{ asset_prefix }}contact.html" data-track="footer_contact">Contact</a>
      </nav>
    </div>
  </footer>
</body>
</html>
